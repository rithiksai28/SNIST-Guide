# ============================================================================
# Cloudflare Pages / Workers Configuration for SNIST GUIDE
# ============================================================================

name = "snist-guide"
compatibility_date = "2024-09-01"
pages_build_output_dir = "dist"

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "DB"
database_name = "snist-guide-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[vars]
# Administrator Email for SNIST GUIDE CMS
ADMIN_EMAIL = "rithiksai608060@gmail.com"

# Note: Set sensitive secrets via Cloudflare Dashboard or Wrangler CLI:
#   npx wrangler pages secret put ADMIN_PASSWORD
#   npx wrangler pages secret put ADMIN_SESSION_SECRET
